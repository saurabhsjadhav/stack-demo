# DO NOT apply this at the start.
# This is the intentional failure for the "Failure Simulation" part of the video.
# It sets DB_HOST to a wrong value, so the backend pods will crash
# every time they try to hit /items (connection refused / host not found).
#
# Demo flow:
#   1. kubectl apply -f k8s/99-backend-BROKEN-demo.yaml
#   2. kubectl get pods                -> show CrashLoopBackOff / errors
#   3. kubectl describe pod <pod-name> -> show events
#   4. kubectl logs <pod-name>         -> show the real DB connection error
#   5. Fix it by re-applying the original: kubectl apply -f k8s/03-backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: postgres-wrong-name   # <-- BUG: wrong service name on purpose
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
